<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style >
        body {
            font-family: Arial;
            background: #eee5ff;
            text-align: center;
            padding: 40px;
        }

        .jokecontainer {
            background: white;
            padding: 25px;
            max-width: 400px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
        }

        h3, p {
            padding: 10px;
            background: #f0e9ff;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .btn {
            background-color: #ef53ec;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="jokecontainer"><h1>JOKES</h1>
        <h3 class="setup"></h3>
        <br>
        <p class="punchline"></p>
        <button class="btn">Get New Joke</button>
    </div>
    <script src="Joke.js"></script>
</body>
</html>
